[package]
name = "packdb-otel"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
readme = "README.md"
keywords = ["packdb", "opentelemetry", "tracing", "telemetry"]
repository = "https://github.com/packdb-oss/packdb-sdk"
publish = false
description = "Protocol-neutral W3C trace-context propagation for PackDB clients and services"

[dependencies]
http = { version = "1.3" }
opentelemetry = { version = "0.31", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
tonic = { version = "0.14", features = ["gzip", "zstd"] }

[lints.rust]
missing_docs = "deny"
