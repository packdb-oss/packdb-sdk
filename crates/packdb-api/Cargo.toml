[package]
name = "packdb-api"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.1"
description = "Wire-format response types for PackDB's public query protocols."
license = "Apache-2.0"
readme = "README.md"
keywords = ["packdb", "observability", "api", "prometheus", "loki"]
repository = "https://github.com/packdb-oss/packdb-sdk"
# Retained deliberately during private staging. Publication requires
# a separate reviewed allowlist change and release authorization.
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[lints.rust]
missing_docs = "deny"
