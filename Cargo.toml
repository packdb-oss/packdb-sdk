# Standalone workspace for the PackDB Rust SDK.
#
# This repository is the canonical source of these crates; changes are made
# here. It began as an export from the PackDB monorepo (see EXPORT_MANIFEST.md)
# and inherits nothing from it: every dependency version is declared here.

[workspace]
resolver = "3"
members = [
    "crates/packdb-otel",
    "crates/packdb-client",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"

[profile.release]
# Match the monorepo's release shape so a binary built here behaves as one
# built there.
lto = "thin"
codegen-units = 1
