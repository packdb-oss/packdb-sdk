# Standalone workspace for the PackDB Rust SDK.
#
# This repository is an export: its sources are assembled deterministically
# from a pinned PackDB commit, recorded in EXPORT_MANIFEST.md. It is not a
# fork and it is not edited in place — a change belongs upstream, and reaches
# here by regenerating the export.
#
# Unlike the monorepo it came from, this workspace inherits nothing. Most
# dependency versions come from the pinned source commit; the reviewed SDK-only
# version map in the export kit can advance client dependencies independently
# of the server's Arrow and OpenTelemetry stack.

[workspace]
resolver = "3"
members = [
    "crates/packdb-otel",
    "crates/packdb-client",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"

[profile.release]
# Match the monorepo's release shape so a binary built here behaves as one
# built there.
lto = "thin"
codegen-units = 1
